version: 2

# Plan-only unless scripts/reproduce.py receives --execute. Raw datasets,
# checkpoints and historical prediction bundles remain external to Git.
pipelines:
  all: [main, selector, timing, baselines, external, report]
  verify: [report]

stages:
  main:
    description: Full-validation K12-Z0 and retained internal development schedules
    commands:
      - argv: ["{python}", scripts/init_recent_methods_full_val_campaign.py]
      - argv: ["{python}", scripts/run_recent_methods_full_val_campaign.py, full, --max-workers, "{max_workers}"]
      - argv: ["{python}", scripts/analyse_recent_methods_full_val.py]
      - argv: ["{python}", scripts/audit_recent_methods_full_val.py]

  selector:
    description: Query-top-k, NMS and structured selector mechanism comparison
    commands:
      - argv: ["{python}", scripts/run_final_selector_campaign.py, --phase, register]
      - argv: ["{python}", scripts/run_final_selector_campaign.py, --phase, serial, --execute]
      - argv: ["{python}", scripts/run_final_selector_campaign.py, --phase, soak, --execute]
      - argv: ["{python}", scripts/run_final_selector_campaign.py, --phase, full, --execute]
      - argv: ["{python}", scripts/analyse_final_selector_campaign.py]
      - argv: ["{python}", scripts/final_selector_completion_audit.py]

  timing:
    description: Five serial K12-Z0 timing repetitions on the frozen 1,000-row subset
    commands:
      - foreach:
          - {repetition: 1, position: 1}
          - {repetition: 2, position: 1}
          - {repetition: 3, position: 1}
          - {repetition: 4, position: 1}
          - {repetition: 5, position: 1}
        argv: ["{python}", scripts/run_hardware_matched_timing_trial.py, --method, Z_K12_0, --mode, natural, --repetition, "{repetition}", --order-position, "{position}"]
      - argv: ["{python}", scripts/analyse_hardware_matched_timing.py, --mode, natural]

  baselines:
    description: FastV and Nüwa RefCOCO validation plus within-stack timing
    commands:
      - argv: ["{python}", scripts/run_official_baseline.py, --dataset, refcoco, --task, grounding, --manifest, data/manifests/final_evaluation/refcoco_val_unique.jsonl, --split, val, --method, official_fastv, --target-visual-tokens, "48", --precision, bf16, --run-name, dissertation_refcoco_val_fastv, --output-root, experiments/dissertation_reproduction/fastv, --max-figures, "0", --resume, --skip-existing, --no-wandb]
      - foreach:
          - {method: NUWA_STACK_FULL}
          - {method: NUWA_NATIVE_192}
        argv: ["{python}", scripts/run_native_nuwa_refcoco.py, --method, "{method}", --manifest, data/manifests/final_evaluation/refcoco_val_unique.jsonl, --run-dir, "experiments/dissertation_reproduction/nuwa/{method}", --mode, quality, --resume]
      - foreach:
          - {stack: fastv}
          - {stack: nuwa}
        argv: ["{python}", scripts/run_final_val_timing_campaign.py, --stack, "{stack}", --mode, natural]

  external:
    description: Pinned IVC-Prune within-stack validation and timing campaign
    commands:
      - argv: ["{python}", scripts/prepare_ivc_prune_source.py, --checkout, "{ivc_source}", --lock-output, experiments/ivc_prune_refcoco_val_20260825/SOURCE_LOCK.json]
      - argv: ["{python}", scripts/init_ivc_prune_campaign.py, --model-snapshot, "{ivc_model}"]
      - foreach:
          - {phase: smoke}
          - {phase: quality}
          - {phase: timing-natural}
        argv: ["{python}", scripts/run_ivc_prune_campaign.py, --phase, "{phase}", --python, "{ivc_python}", --source-root, "{ivc_source}", --model-snapshot, "{ivc_model}"]
      - argv: ["{python}", scripts/analyse_ivc_prune_campaign.py, --phase, quality]
      - argv: ["{python}", scripts/analyse_ivc_prune_campaign.py, --phase, timing-natural]
      - argv: ["{python}", scripts/audit_ivc_prune_campaign.py]

  report:
    description: Rebuild README figures and verify the compact accepted evidence
    commands:
      - argv: ["{python}", scripts/generate_readme_figures.py]
      - argv: ["{python}", scripts/verify_dissertation_results.py]
